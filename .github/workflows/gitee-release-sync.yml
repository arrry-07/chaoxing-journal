name: GitHub release index and Gitee batch sync

# Every published GitHub Release updates the small Gitee index. APK mirroring
# remains an explicit batch operation with no scheduled or per-release upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: Update the small index, sync a batch checkpoint, or seed explicit tags
        required: true
        type: choice
        default: index
        options:
          - index
          - latest
          - seed
      tags:
        description: Optional index/seed tag, or comma-separated seed tags
        required: false
        type: string
        default: ""
      retention:
        description: Maximum APK releases retained on Gitee
        required: true
        type: choice
        default: "3"
        options:
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: gitee-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update index or verify and publish a Gitee batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      MODE: ${{ github.event_name == 'release' && 'index' || inputs.mode || 'index' }}
      TAGS: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tags }}
      RETENTION: ${{ inputs.retention || '3' }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APK verification tools
        if: ${{ github.event_name != 'release' && inputs.mode != 'index' }}
        run: |
          # ubuntu-latest already provides the Android SDK and cmdline tools.
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Run offline synchronizer tests
        run: |
          python3 -m py_compile scripts/gitee_release_sync.py
          python3 scripts/test_gitee_release_sync.py
          python3 scripts/test_gitee_workflow.py

      - name: Synchronize Gitee distribution
        shell: bash
        run: |
          args=(
            --mode "$MODE"
            --retention "$RETENTION"
          )
          if [[ -n "$TAGS" ]]; then
            args+=(--tags "$TAGS")
          fi
          if [[ "$MODE" != "index" ]]; then
            AAPT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt"
            APKSIGNER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
            test -x "$AAPT"
            test -x "$APKSIGNER"
            args+=(--aapt "$AAPT" --apksigner "$APKSIGNER")
          fi
          python3 scripts/gitee_release_sync.py "${args[@]}"
