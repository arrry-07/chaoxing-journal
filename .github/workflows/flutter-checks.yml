name: Flutter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: study_assistant-1.1.0/local_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
