name: Flutter checks
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: study_assistant-1.1.0/local_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            study_assistant-1.1.0/local_app/android/**/*.gradle
            study_assistant-1.1.0/local_app/android/gradle/wrapper/gradle-wrapper.properties
            study_assistant-1.1.0/local_app/android/gradle.properties
            study_assistant-1.1.0/local_app/pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Configure CI Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat <<'EOF' > "$HOME/.gradle/init.d/ci-maven-mirror.gradle"
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                      content {
                          excludeGroupByRegex("com\\.android.*")
                          excludeGroupByRegex("androidx.*")
                      }
                  }
                  if (settings.gradle.parent != null) {
                      gradlePluginPortal()
                  }
              }
              if (settings.gradle.parent != null) {
                  settings.dependencyResolutionManagement.repositories {
                      maven {
                          name = "GoogleMavenCentralMirror"
                          url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                          content {
                              excludeGroupByRegex("com\\.android.*")
                              excludeGroupByRegex("androidx.*")
                          }
                      }
                  }
              }
          }
          allprojects { project ->
              project.buildscript.repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                      content {
                          excludeGroupByRegex("com\\.android.*")
                          excludeGroupByRegex("androidx.*")
                      }
                  }
              }
              if (project.gradle.parent == null) {
                  project.repositories {
                      maven {
                          name = "GoogleMavenCentralMirror"
                          url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                          content {
                              excludeGroupByRegex("com\\.android.*")
                              excludeGroupByRegex("androidx.*")
                          }
                      }
                  }
              }
          }
          EOF
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check release metadata and changed Dart formatting
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/dev ]]; then
            python3 tool/check_release_metadata.py --allow-dev
          else
            python3 tool/check_release_metadata.py
          fi
          python3 tool/check_changed_format.py
      - name: Check repo safety, scripts and L0 doc budget
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/check_repo_safety.py --worktree
          python3 -m py_compile scripts/*.py study_assistant-1.1.0/local_app/tool/*.py
          python3 scripts/test_check_repo_safety.py
          python3 scripts/test_verify_apk_and_report.py
          python3 scripts/test_gitee_release_sync.py
          python3 scripts/test_gitee_workflow.py
          python3 -c 'from pathlib import Path; a = len(Path("AGENTS.md").read_text(encoding="utf-8").splitlines()); s = len(Path("docs/ai-workflow/PROJECT_STATE.md").read_text(encoding="utf-8").splitlines()); assert a + s <= 80, f"L0 doc line budget exceeded: {a} + {s} = {a + s} > 80"; print(f"[PASS] L0 doc line budget: {a} + {s} = {a + s} <= 80")'
      - name: Run synthetic JVM checks
        run: |
          if ! curl --fail --location --retry 2 https://maven-central.storage-download.googleapis.com/maven2/org/json/json/20180813/json-20180813.jar -o "$RUNNER_TEMP/json.jar"; then
            curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20180813/json-20180813.jar -o "$RUNNER_TEMP/json.jar"
          fi
          echo "518080049ba83181914419d11a25d9bc9833a2d729b6a6e7469fa52851356da8  $RUNNER_TEMP/json.jar" | sha256sum --check
          python3 tool/run_native_checks.py --json-jar "$RUNNER_TEMP/json.jar"
      - name: Run application native unit tests and lint
        run: bash android/gradlew -p android :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run all tests in UTC
        env:
          TZ: UTC
        run: flutter test --no-pub
      - name: Check deadline tests in other time zones
        run: |
          for timezone in Asia/Shanghai America/Los_Angeles; do
            echo "Testing deadlines in $timezone"
            TZ="$timezone" flutter test --no-pub test/journal_flow_test.dart test/chaoxing_api_parser_test.dart test/review_core_remediation_test.dart test/assignment_detail_navigation_test.dart test/signed_deadline_anchor_test.dart test/assignment_query_test.dart test/home_scope_sort_1806_test.dart test/academic_term_scope_test.dart
          done
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
      - name: Verify packaged Android ABIs
        run: |
          python3 tool/check_apk_abis.py \
            build/app/outputs/flutter-apk/app-debug.apk \
            --abi arm64-v8a \
            --abi x86_64
