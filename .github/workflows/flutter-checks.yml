name: Flutter checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: study_assistant-1.1.0/local_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run all tests in UTC
        env:
          TZ: UTC
        run: flutter test --no-pub
      - name: Check deadline tests in other time zones
        run: |
          for timezone in Asia/Shanghai America/Los_Angeles; do
            echo "Testing deadlines in $timezone"
            TZ="$timezone" flutter test --no-pub test/journal_flow_test.dart test/chaoxing_api_parser_test.dart test/review_core_remediation_test.dart test/assignment_detail_navigation_test.dart
          done
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
