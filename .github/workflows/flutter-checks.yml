name: Flutter checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: study_assistant-1.1.0/local_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check release metadata and changed Dart formatting
        run: |
          python3 tool/check_release_metadata.py
          python3 tool/check_changed_format.py
      - name: Run synthetic JVM checks
        run: |
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20180813/json-20180813.jar -o "$RUNNER_TEMP/json.jar"
          echo "518080049ba83181914419d11a25d9bc9833a2d729b6a6e7469fa52851356da8  $RUNNER_TEMP/json.jar" | sha256sum --check
          python3 tool/run_native_checks.py --json-jar "$RUNNER_TEMP/json.jar"
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run all tests in UTC
        env:
          TZ: UTC
        run: flutter test --no-pub
      - name: Check deadline tests in other time zones
        run: |
          for timezone in Asia/Shanghai America/Los_Angeles; do
            echo "Testing deadlines in $timezone"
            TZ="$timezone" flutter test --no-pub test/journal_flow_test.dart test/chaoxing_api_parser_test.dart test/review_core_remediation_test.dart test/assignment_detail_navigation_test.dart
          done
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
