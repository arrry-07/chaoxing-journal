name: 功能建议
description: 描述使用场景和希望改善的体验
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与遇到的困难
      description: 目前怎样操作，哪一步不方便？请勿填写个人账号资料。
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 希望的行为
      description: 可以附合成数据的草图或排版参考。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法或其他说明（可选）
