IM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n\nTHIRD_PARTY_NOTICES.md\n# Third-party notices\n\nArchify includes optional vector data for third-party brand marks. These marks\nare provided only to identify technologies and services in user-authored\ndiagrams. Their inclusion does not imply sponsorship, endorsement, partnership,\nor affiliation with Archify.\n\nArchify's license and historical MIT grants are described in LICENSE, NOTICE,\nand LICENSE-MIT. The software license does not\nreplace the copyright licenses, trademark policies, or brand guidelines that\napply to third-party marks. Users are responsible for confirming that their\nparticular use is permitted.\n\n## Simple Icons\n\nMost of the built-in vector paths and their metadata were generated from\n[Simple Icons 16.28.0](https://github.com/simple-icons/simple-icons/tree/16.28.0).\nSimple Icons makes its collection work available under\n[CC0 1.0 Universal](https://github.com/simple-icons/simple-icons/blob/16.28.0/LICENSE.md).\n\nAs Simple Icons explains in its\n[disclaimer](https://github.com/simple-icons/simple-icons/blob/16.28.0/DISCLAIMER.md),\nCC0 for the collection does not mean that every underlying icon is CC0. License\nand brand-guideline metadata may be incomplete or change over time. The absence\nof an individual license entry is not a grant of permission.\n\nArchify embeds the selected icons as vector-path data and may render them in a\nuser-selected color. The following individual licenses were recorded in the\npinned Simple Icons 16.28.0 metadata:\n\n| Mark | Recorded source | Recorded license | Archify treatment |\n|---|---|---|---|\n| Angular | [Angular press kit](https://angular.dev/press-kit) | [`CC-BY-4.0`](https://creativecommons.org/licenses/by/4.0/) | Embedded as vector-path data; color may be changed by the authored diagram. |\n| Apache Airflow | [Apache logos](https://apache.org/logos) | [`Apache-2.0`](https://www.apache.org/licenses/LICENSE-2.0) | Embedded as vector-path data; Apache trademarks remain subject to the [ASF trademark policy](https://www.apache.org/foundation/marks/). |\n| Apache Kafka | [Apache logos](https://apache.org/logos) | [`Apache-2.0`](https://www.apache.org/licenses/LICENSE-2.0) | Embedded as vector-path data; Apache trademarks remain subject to the [ASF trademark policy](https://www.apache.org/foundation/marks/). |\n| .NET | [.NET brand repository](https://github.com/dotnet/brand/blob/c7d0f51b8ec59531332d05fb27a5b758a7a3d689/logo/dotnet-logo.svg) | [`CC0-1.0`](https://creativecommons.org/publicdomain/zero/1.0/) | Embedded as vector-path data; color may be changed by the authored diagram. |\n| JavaScript | [JS community logo](https://github.com/voodootikigod/logo.js/blob/1544bdeed6d618a6cfe4f0650d04ab8d9cfa76d9/js.svg) | [`MIT`](https://github.com/voodootikigod/logo.js/blob/1544bdeed6d618a6cfe4f0650d04ab8d9cfa76d9/LICENSE) | Embedded as vector-path data; color may be changed by the authored diagram. |\n| Jenkins | [Jenkins artwork source](https://get.jenkins.io/art/) | [`CC-BY-SA-3.0`](https://creativecommons.org/licenses/by-sa/3.0/) | Embedded as vector-path data; color may be changed by the authored diagram. Jenkins retains its trademark rights. |\n| Rust | [Rust project](https://www.rust-lang.org) | [`CC-BY-SA-4.0`](https://creativecommons.org/licenses/by-sa/4.0/) | Embedded as vector-path data; color may be changed by the authored diagram. See the [Rust media guide](https://www.rust-lang.org/policies/media-guide). |\n| Vue.js | [Vue logo source](https://github.com/vuejs/art/blob/a1c78b74569b70a25300925b4eacfefcc143b8f6/logo.svg) | [`CC-BY-NC-SA-4.0`](https://creativecommons.org/licenses/by-nc-sa/4.0/) | Embedded as vector-path data; color may be changed by the authored diagram. The non-commercial and share-alike conditions remain applicable; see the [Vue artwork terms](https://github.com/vuejs/art/blob/a1c78b74569b70a25300925b4eacfefcc143b8f6/README.md). |\n\nThe source, guideline, and known license fields for every packaged mark are\npreserved in `renderers/shared/generated-brand-marks.mjs`.\n\n## OpenAI mark\n\nThe OpenAI vector path is recorded from the\n[OpenAI brand guidelines](https://openai.com/brand/), not from Simple Icons.\nUse remains subject to those current guidelines and any applicable trademark\nrights. Its inclusion does not state or imply endorsement by OpenAI.\n\n## JetBrains Mono\n\nDelivered Archify viewer artifacts embed the JetBrains Mono variable font\nsubsets served by Google Fonts. For characters covered by these subsets, font\nselection does not depend on a network request or a locally installed copy.\nUncovered characters (including CJK) still use the system fallback stack;\nbrowser and operating-system rasterization can differ.\nJetBrains Mono is maintained at\n[github.com/JetBrains/JetBrainsMono](https://github.com/JetBrains/JetBrainsMono)\nand is distributed under the SIL Open Font License 1.1. The complete license\ntext is preserved in `assets/JetBrainsMono-OFL.txt` in the packaged Skill and\nin the font CSS carried by standalone HTML and SVG exports.\n\n## Pele\n\nThe explainer renders Mermaid chart fences with an unmodified subset of\n[Pele 1.3.0](https://github.com/obsidianmd/pele), copyright (c) 2026 kepano,\ndistributed under the MIT License. The subset and its license text are in\n`explainer/vendor/pele/` in the packaged Skill. Charts are rendered to static\nSVG when a page is built; delivered pages contain no Pele code.\n\n## No additional rights granted\n\nBrand names, logos, and trademarks remain the property of their respective\nowners. This notice records provenance and known terms; it does not grant rights\nthat Archify does not hold, and it does not state that every packaged mark has\nbeen cleared for every commercial, promotional, or redistributive use.\n\n## Story HTML parser\n\nThe Node story scanner and builder include parse5 7.3.0 (MIT) and entities\n6.0.1 (BSD-2-Clause), bundled into `story/vendor/html-parser.mjs`. The parser is\nnot embedded in generated HTML. Pinned sources, rebuild instructions and the\ncomplete licenses are in `story/vendor/`.\n\n## Code Analysis external diagnostics\n\nThe Code Analysis module includes the unmodified\n[OASIS SARIF 2.1.0 schema](https://github.com/oasis-tcs/sarif-spec/blob/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json)\nfrom revision `1742a253`. Its repository content is governed by the\n[OASIS license terms and policies](https://github.com/oasis-tcs/sarif-spec/blob/1742a253eb654bf8a4ed7c60eaef7412b2c23553/LICENSE.md),\nincluding RF on RAND Terms Mode. The original terms are preserved in\n`modules/code-analysis/import/vendor/OASIS-LICENSE.md` in the packaged Skill.\n\nThe line-context fingerprint algorithm is adapted from\n[github/codeql-action](https://github.com/github/codeql-action/blob/592d162ba3b2f5a3411d2cbf01df9f82c492f269/src/fingerprints.ts),\nrevision `592d162b`, copyright (c) 2020 GitHub, under the MIT License.\nThe complete license is preserved in\n`modules/code-analysis/import/vendor/CODEQL-LICENSE.txt` in the packaged Skill.\n\n## Code Analysis Atlas 3D\n\nThe Atlas 3D view includes the unmodified minified build of\n[three.js](https://github.com/mrdoob/three.js) r128 (`three@0.128.0` on npm,\n`build/three.min.js`), copyright 2010-2021 three.js authors, under the MIT\nLicense. It is embedded in the analysis page and runs only when Atlas 3D is\nopened. The complete license is preserved in\n`modules/code-analysis/overlay/vendor/THREE-LICENSE.txt` in the packaged Skill."</script>

body{margin:0;background:var(--stage-bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:16px 20px}
.shell{width:min(1040px,100%);display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.bar h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}

:where(.controls>button,.stage-step):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}

<body>
<main class="shell">
  <header class="bar">
    <h1>学习通课业手记 · 核心架构与防脏写提醒漫游</h1>
    <div class="toolbar stage-toolbar" role="toolbar" aria-label="图表操作">
      <div class="toolbar-group">
        <button id="stage-theme" type="button"

      <span id="stage-theme-icon" class="toolbar-icon" aria-hidden="true"></span>
      <span id="stage-theme-label">深色</span>
    </button>
        <div class="preset-wrap">

      </button>

        <div class="preset-menu-heading" role="presentation"><span>视觉表达</span><span class="preset-menu-shortcut"><kbd>S</kbd>循环切换</span></div>
        <button class="preset-option" data-preset-value="classic" type="button" role="menuitemradio" aria-checked="false" tabindex="-1">
          <span class="preset-option-swatch classic" aria-hidden="true"></span>
          <span class="preset-option-copy"><strong>经典</strong><small>稳定的技术默认风格</small></span>
          <span class="preset-option-check" aria-hidden="true"></span>
        </button>
        <button class="preset-option" data-preset-value="signal-flow" type="button" role="menuitemradio" aria-checked="false" tabindex="-1">
          <span class="preset-option-swatch signal-flow" aria-hidden="true"></span>
          <span class="preset-option-copy"><strong>信号流</strong><small>突出动态流向</small></span>
          <span class="preset-option-check" aria-hidden="true"></span>

        <button class="preset-option" data-preset-value="blueprint" type="button" role="menuitemradio" aria-checked="false" tabindex="-1">
          <span class="preset-option-swatch blueprint" aria-hidden="true"></span>
          <span class="preset-option-copy"><strong>蓝图</strong><small>工程评审</small></span>
          <span class="preset-option-check" aria-hidden="true"></span>
        </button>
        <button class="preset-option" data-preset-value="editorial" type="button" role="menuitemradio" aria-checked="false" tabindex="-1">
          <span class="preset-option-swatch editorial" aria-hidden="true"></span>
          <span class="preset-option-copy"><strong>编辑风格</strong><small>适合发布与上线说明</small></span>
          <span class="preset-option-check" aria-hidden="true"></span>
        </button>
      </div>
    </div>
      </div>
      <div class="export-wrap">
        <button id="stage-export" type="button"
              title="导出图表（E）"
              aria-label="导出图表"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="stage-export-menu">
        导出 <span class="toolbar-icon toolbar-chevron" aria-hidden="true"></span>
      </button>
        <div class="export-menu" id="stage-export-menu" role="menu" aria-label="导出">
          <div class="export-menu-header" role="presentation">
          <div><strong>导出图表</strong><span>便携、整洁的输出</span></div>
          <kbd>E</kbd>
        </div>
          <div class="export-menu-section" role="group" aria-label="图像">
            <span class="export-menu-heading" aria-hidden="true">图像</span>
            <button id="stage-export-png" data-format="png" type="button" role="menuitem" tabindex="-1"><span class="export-item-copy"><strong>PNG</strong><small class="hint">无损图像 · 1080p</small></span></button>
          </div>
          <div class="export-menu-section" role="group" aria-label="视频">
            <span class="export-menu-heading" aria-hidden="true">视频</span>
            <button id="stage-export-mp4" data-format="mp4" type="button" role="menuitem" tabindex="-1"><span class="export-item-copy"><strong>MP4</strong><small class="hint">1080p · 60 fps</small></span></button>
            <button id="stage-export-webm" data-format="webm" type="button" role="menuitem" tabindex="-1"><span class="export-item-copy"><strong>WebM</strong><small class="hint">1080p · 60 fps</small></span></button>
          </div>
        </div>
      </div>

## JetBrains Mono

Delivered Archify viewer artifacts embed the JetBrains Mono variable font
subsets served by Google Fonts. For characters covered by these subsets, font
selection does not depend on a network request or a locally installed copy.
Uncovered characters (including CJK) still use the system fallback stack;
browser and operating-system rasterization can differ.
JetBrains Mono is maintained at
[github.com/JetBrains/JetBrainsMono](https://github.com/JetBrains/JetBrainsMono)
and is distributed under the SIL Open Font License 1.1. The complete license
text is preserved in `assets/JetBrainsMono-OFL.txt` in the packaged Skill and
in the font CSS carried by standalone HTML and SVG exports.

[Pele 1.3.0](https://github.com/obsidianmd/pele), copyright (c) 2026 kepano,
distributed under the MIT License. The subset and its license text are in
`explainer/vendor/pele/` in the packaged Skill. Charts are rendered to static
SVG when a page is built; delivered pages contain no Pele code.

Brand names, logos, and trademarks remain the property of their respective
owners. This notice records provenance and known terms; it does not grant rights
that Archify does not hold, and it does not state that every packaged mark has
been cleared for every commercial, promotional, or redistributive use.

6.0.1 (BSD-2-Clause), bundled into `story/vendor/html-parser.mjs`. The parser is
not embedded in generated HTML. Pinned sources, rebuild instructions and the
complete licenses are in `story/vendor/`.

    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function openOptionalSaveWriter(format, ext, filename) {
    if (typeof showSaveFilePicker !== 'function') return null;
    const mime = format === 'webm' ? 'video/webm' : 'video/mp4';
    const handle = await showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: `${format.toUpperCase()} video`, accept: { [mime]: [ext] } }],
    });
    return handle.createWritable();
  }

  async function withVideoExport(run, callerSignal) {
    if (activeJob) throw Error('A story export is already running.');
    const controller = new AbortController();
    activeJob = controller;
    closeMenu();
    const controls = [...toolbarButtons, ...exportOptions];
    const disabledStates = controls.map(control => control.disabled && !(control === pngBtn && savingPng));
    for (const control of controls) control.disabled = true;
    const abortFromCaller = () => controller.abort(callerSignal.reason);
    try {
      if (callerSignal?.aborted) abortFromCaller();
      else callerSignal?.addEventListener('abort', abortFromCaller, { once: true });
      return await run(controller.signal);
    } finally {
      activeJob = null;
      controls.forEach((control, i) => { control.disabled = disabledStates[i] || (control === pngBtn && savingPng); });
      callerSignal?.removeEventListener('abort', abortFromCaller);
    }
  }

  function startVideoExport(options, writer) {
    return withVideoExport(signal => encodeVideo({ ...options, signal }, writer), options?.signal);
  }

  async function saveVideo(format, signal) {
    const prev = statusEl.textContent;
    const ext = format === 'webm' ? '.webm' : '.mp4';
    const filename = `story-${currentTheme}-1080p${ext}`;
    statusEl.textContent = labels.exporting;
    let writer = null;
    try {
      writer = await openOptionalSaveWriter(format, ext, filename);
      const res = await encodeVideo({
        format,
        signal,
        onProgress: (ev) => { statusEl.textContent = `${labels.exporting} ${Math.round(ev.fraction * 100)}%`; },
      }, writer);
      if (writer) await writer.close();
      else downloadBlob(res, filename);
      statusEl.textContent = prev;
    } catch (error) {
      try { await writer?.abort(error); } catch {}
      statusEl.textContent = error.name === 'AbortError' ? prev : (error.message || String(error));
    }
  }

  async function runDownload(format) {
    if (activeJob) return;
    await withVideoExport(signal => saveVideo(format, signal));
    if (document.activeElement === document.body) exportBtn.focus();
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) pause();
  syncThemeButton();
  requestAnimationFrame(tick);
  playBtn.addEventListener('click', () => (playing ? pause() : play()));
  replayBtn.addEventListener('click', () => { playing = true; applyTime(0, true); });
  themeBtn.addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));
  if (presetControl) {
    setPreset(currentPreset);
    bindMenu(presetControl);
    presetMenu.addEventListener('click', (event) => {
      const option = event.target.closest('[data-preset-value]');
      if (!option || activeJob) return;
      setPreset(option.dataset.presetValue);
      closeMenu(true);
    });
  }
  bindMenu(exportControl);
  document.addEventListener('click', (event) => {
    if (openControl && !openControl.button.parentElement.contains(event.target)) closeMenu();
  });
  range.addEventListener('input', () => applyTime(Number(range.value), false));
  range.addEventListener('change', () => applyTime(Number(range.value), playing));
  stepButtons.forEach((btn) => btn.addEventListener('click', () => seek(Number(btn.dataset.stepAt))));
  document.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || event.isComposing || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key === 'Escape' && openControl) {
      event.preventDefault();
      closeMenu(true);
      return;
    }
    if (event.key === 'Tab') closeMenu(true);
    const target = event.target instanceof Element ? event.target : document.activeElement;
    if (target?.isContentEditable || target?.closest('input,textarea,select')) return;
    const buttonFocused = target?.closest('button');
    if (!activeJob && !event.shiftKey && ['e', 'E'].includes(event.key)) {
      event.preventDefault();
      toggleMenu(exportControl);
      return;
    }
    if (!activeJob && ['t', 'T'].includes(event.key)) {
      event.preventDefault();
      closeMenu();
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      return;
    }
    if (buttonFocused) return;
    if (!activeJob && presetBtn && !presetBtn.disabled && (event.key === 's' || event.key === 'S')) {
      event.preventDefault();
      const next = (meta.presets.indexOf(currentPreset) + 1) % meta.presets.length;
      setPreset(meta.presets[next]);
    }
    if (event.code === 'Space' && !playBtn.disabled) {
      event.preventDefault();
      playing ? pause() : play();
    }
  });
  pngBtn.addEventListener('click', async () => {
    if (activeJob) return;
    closeMenu(true);
    savingPng = true;
    pngBtn.disabled = true;
    const filename = `story-${currentTheme}.png`;
    try { downloadBlob(await exportPNG(), filename); }
    finally {
      savingPng = false;
      pngBtn.disabled = Boolean(activeJob);
    }
  });
  for (const button of [mp4Btn, webmBtn]) {
    button.addEventListener('click', () => {
      closeMenu(true);
      runDownload(button.dataset.format);
    });
  }

  const api = {
    play,
    pause,
    seek,
    setTheme,
    setPreset,
    exportPNG,
    exportVideo: (options) => startVideoExport(options),
    writeVideo: (writer, options) => startVideoExport(options, writer),
    cancelExport: () => activeJob?.abort(),
    duration: meta.duration,
    defaults: { width: WIDTH, height: HEIGHT, fps: DEFAULT_FPS, format: 'webm' },
    state: () => ({ theme: currentTheme, preset: currentPreset, playing, time: currentTime, duration: meta.duration, steps: meta.steps }),
  };
  window.ArchifyStoryStage = api;
  window.StoryStage = api;
  Promise.resolve(document.fonts?.ready).finally(() => { window.storyStageReady = true; });
})();
</script>
