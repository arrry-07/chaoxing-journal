name: study_assistant_mobile
description: 学习通作业提醒本地版 App。
publish_to: "none"
version: 1.7.3+55

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^18.0.1
  go_router: ^14.6.2
  home_widget: ^0.7.0
  intl: ^0.20.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: LXGW WenKai Screen
      fonts:
        - asset: assets/type/LXGWWenKaiScreen.ttf
          weight: 400
  assets:
    - assets/licenses/HY.txt
    - assets/licenses/xuexitong-cli.txt
    - assets/type/OFL-WenKai.txt
