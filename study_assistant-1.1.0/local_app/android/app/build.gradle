import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.studyassistant"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.studyassistant"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".journal"
        }
        release {
            // The public 1.6.2 experience channel uses the .journal identity.
            // Keep the Release applicationId identical so existing installs can
            // receive the GitHub update without uninstalling or losing data.
            applicationIdSuffix ".journal"
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            // This app has no armeabi-v7a Flutter engine. Exclude the whole
            // unsupported ABI so a future auxiliary JNI dependency cannot make
            // PackageManager advertise an architecture that cannot start.
            excludes += [
                "lib/armeabi-v7a/**"
            ]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

// Debug builds remain available; publishing must never silently use a debug key.
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropertiesFile.exists() && graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains("release")
    }) {
        throw new GradleException("Release requires android/key.properties and a private signing key")
    }
}
